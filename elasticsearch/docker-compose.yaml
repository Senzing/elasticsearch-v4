services:

  postgres:
    container_name: senzing-postgres
    environment:
      # See https://hub.docker.com/_/postgres
      POSTGRES_DB: ${POSTGRES_DB:-senzing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DB:-senzing}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    image: postgres:${SENZING_DOCKER_IMAGE_VERSION_POSTGRES:-18}
    networks:
      - senzing
    ports:
      - 5432:5432
    restart: always
    volumes:
      - ${POSTGRES_DIR:-/var/lib/postgresql}:/var/lib/postgresql

  initdatabase:
    container_name: senzing-tools-init-database
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SENZING_TOOLS_DATASOURCES: CUSTOMERS REFERENCE WATCHLIST
      SENZING_TOOLS_CORE_SETTINGS: >-
        {
          "PIPELINE": {
            "CONFIGPATH": "/etc/opt/senzing",
            "LICENSESTRINGBASE64": "${SENZING_LICENSE_BASE64_ENCODED}",
            "RESOURCEPATH": "/opt/senzing/er/resources",
            "SUPPORTPATH": "/opt/senzing/data"
          },
          "SQL": {
            "BACKEND": "SQL",
            "CONNECTION": "postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-senzing-postgres}:${POSTGRES_PORT:-5432}:${POSTGRES_DB:-senzing}/?sslmode=disable"
          }
        }
    image: senzing/init-database:${SENZING_DOCKER_IMAGE_VERSION_INIT_DATABASE:-0.8.9}
    networks:
      - senzing
    read_only: true
    restart: on-failure

networks:
  senzing:
    name: ${SENZING_DOCKER_NETWORK:-senzing-network}
